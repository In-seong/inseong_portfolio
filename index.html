<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inseong — Full-Stack Developer</title>
<meta name="description" content="Full-stack developer building real-world systems — enterprise SaaS, marketplaces, unmanned-store & IoT platforms across web, mobile, desktop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070e; --bg2:#0b0b16; --surface:#111220; --surface2:#161829;
    --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
    --text:#eef0f8; --muted:#8c92ad; --dim:#5f6580;
    --violet:#7b61ff; --cyan:#28e0cf; --pink:#ff5da2;
    --maxw:1120px;
    --grad:linear-gradient(100deg,var(--violet),var(--cyan));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* 3D network canvas — persistent background */
  #net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 80% at 50% -10%,rgba(123,97,255,.10),transparent 55%),
    linear-gradient(180deg,transparent 0%,rgba(7,7,14,.35) 60%,var(--bg) 100%)}
  header,main,footer{position:relative;z-index:3}

  /* custom cursor */
  .cur,.curdot{position:fixed;top:0;left:0;z-index:100;pointer-events:none;border-radius:50%;mix-blend-mode:difference;will-change:transform}
  .cur{width:34px;height:34px;border:1.5px solid #fff;margin:-17px 0 0 -17px;transition:width .2s,height .2s,margin .2s,opacity .2s;opacity:0}
  .curdot{width:5px;height:5px;background:#fff;margin:-2.5px 0 0 -2.5px;opacity:0}
  .cur.big{width:64px;height:64px;margin:-32px 0 0 -32px}
  body.hascursor .cur,body.hascursor .curdot{opacity:1}

  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(7,7,14,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-family:"Space Grotesk";font-weight:700;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;gap:9px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px var(--violet)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:none;color:var(--muted);padding:6px 13px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
  .lang button.active{background:#fff;color:#0a0a12}
  .cta{background:var(--grad);color:#0a0a12;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.85rem;transition:transform .15s,box-shadow .2s}
  .cta:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(123,97,255,.4)}

  /* hero */
  .hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0 40px}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 14px;width:fit-content;background:rgba(255,255,255,.02)}
  .status .pulse{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(40,224,207,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,224,207,.55)}70%{box-shadow:0 0 0 10px rgba(40,224,207,0)}100%{box-shadow:0 0 0 0 rgba(40,224,207,0)}}
  .hero h1{font-size:clamp(2.6rem,8vw,5.6rem);line-height:1.02;font-weight:700;margin:26px 0 0}
  .hero h1 .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero .line{display:block;overflow:hidden}
  .hero .line > span{display:block;transform:translateY(105%)}
  .hero .lead{color:var(--muted);font-size:clamp(1rem,2.2vw,1.22rem);max-width:600px;margin:28px 0 0}
  .hero-cta{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
  .btn-solid{background:var(--grad);color:#0a0a12;padding:13px 26px;border-radius:999px;font-weight:700;font-size:.92rem;transition:transform .15s,box-shadow .2s}
  .btn-solid:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(123,97,255,.4)}
  .btn-ghost{border:1px solid var(--border2);padding:13px 24px;border-radius:999px;font-weight:600;font-size:.92rem;transition:.15s}
  .btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
  .scrollcue{margin-top:54px;color:var(--dim);font-size:.75rem;letter-spacing:.2em;display:flex;align-items:center;gap:10px}
  .scrollcue .bar{width:34px;height:1px;background:var(--dim);position:relative;overflow:hidden}
  .scrollcue .bar:after{content:"";position:absolute;inset:0;background:var(--cyan);animation:sweep 2.2s infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  /* marquee */
  .marquee{border-block:1px solid var(--border);padding:16px 0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .marquee .track{display:inline-flex;gap:40px;animation:scroll 32s linear infinite}
  .marquee span{font-family:"Space Grotesk";font-size:1.1rem;font-weight:500;color:var(--muted)}
  .marquee span b{color:var(--text)}
  @keyframes scroll{to{transform:translateX(-50%)}}

  section.block{padding:76px 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:38px;flex-wrap:wrap}
  .sec-head h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700}
  .sec-head .idx{font-family:"Space Grotesk";color:var(--dim);font-size:.85rem}
  .sec-head p{color:var(--muted);margin-top:6px;max-width:440px}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:18px;overflow:hidden}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--bg2);padding:28px 22px}
  .stat b{font-family:"Space Grotesk";display:block;font-size:2.6rem;font-weight:700;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat span{color:var(--muted);font-size:.82rem;display:block;margin-top:10px}

  /* project grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;transform-style:preserve-3d;transition:border-color .25s,box-shadow .25s;will-change:transform}
  .card:hover{border-color:var(--border2);box-shadow:0 24px 60px -24px rgba(123,97,255,.5)}
  .card .glow{position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(123,97,255,.14),transparent 60%);pointer-events:none}
  .card:hover .glow{opacity:1}
  .card .shot{aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--border);background:var(--surface2)}
  .card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
  .card:hover .shot img{transform:scale(1.04)}
  .card .noshot{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 30% 20%,rgba(123,97,255,.12),transparent),var(--surface2)}
  .noshot svg{width:70px;height:70px;stroke:url(#gg);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .card .body{padding:22px 22px 24px;transform:translateZ(30px)}
  .kicker{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .domain{font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--cyan);text-transform:uppercase}
  .live{font-size:.68rem;font-weight:700;color:#0a0a12;background:var(--cyan);border-radius:999px;padding:2px 9px}
  .card h3{font-size:1.28rem;font-weight:600;margin-bottom:9px}
  .card .desc{color:var(--muted);font-size:.92rem}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .tag{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:.72rem;color:var(--muted)}
  .card .more{margin-top:16px;font-size:.84rem;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px}
  .card .more i{transition:transform .2s}
  .card:hover .more i{transform:translateX(4px)}

  /* detail */
  .detail{padding:36px 0 20px}
  .back{color:var(--muted);font-size:.9rem;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;margin-bottom:26px}
  .back:hover{color:var(--cyan)}
  .dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
  .detail h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:700;margin:8px 0 16px}
  .dlead{color:var(--muted);font-size:1.08rem;max-width:720px;margin-bottom:24px}
  .dhero{width:100%;border:1px solid var(--border);border-radius:20px;overflow:hidden;margin:8px 0 32px;background:var(--surface2)}
  .dhero img{width:100%;display:block}
  .dhero.portrait{display:flex;justify-content:center;padding:26px}
  .dhero.portrait img{width:auto;max-height:580px;border-radius:12px;border:1px solid var(--border)}
  .dhero.noimg{aspect-ratio:16/6;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 30% 20%,rgba(123,97,255,.14),transparent),var(--surface2)}
  .dhero.noimg svg{width:104px;height:104px;stroke:url(#gg);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:34px}
  @media(max-width:680px){.dgrid{grid-template-columns:1fr}}
  .dsec{margin:24px 0}
  .dsec h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);font-weight:700;margin-bottom:11px}
  .dsec p{color:#c6cadb}
  .dsec ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .dsec li{color:#c6cadb;padding-left:22px;position:relative}
  .dsec li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:2px;background:var(--grad)}
  .metabox{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
  .metabox .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:.9rem}
  .metabox .row:last-child{border:none}
  .metabox .k{color:var(--muted)} .metabox .v{text-align:right;font-weight:600}

  .contact{text-align:center;border:1px solid var(--border);border-radius:26px;padding:60px 24px;background:radial-gradient(120% 140% at 50% 0%,rgba(123,97,255,.12),transparent 60%),var(--surface)}
  .contact h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:700;margin-bottom:14px}
  .contact p{color:var(--muted);max-width:520px;margin:0 auto 28px}
  .emailtext{margin-top:20px;color:var(--muted);font-family:"Space Grotesk";font-size:1.02rem;cursor:pointer;letter-spacing:.02em;transition:color .2s}
  .emailtext:hover{color:var(--cyan)}
  footer{border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:.82rem;padding:36px 0 60px;margin-top:40px}

  .reveal{opacity:0;transform:translateY(24px)}
  [hidden]{display:none!important}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .hero .line>span{transform:none}.reveal{opacity:1;transform:none}
  }
</style>
</head>

/* ============ animations & interactions ============ */
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function afterRender(isHome){
 bindMag();bindTilt();
 if(reduce){document.querySelectorAll('.reveal').forEach(function(e){e.style.opacity=1;e.style.transform='none'});return;}
 if(isHome){
   gsap.to('.hero .line>span',{y:0,duration:1,ease:'expo.out',stagger:.12,delay:.1});
   gsap.to('.hero .reveal',{opacity:1,y:0,duration:.9,ease:'power3.out',stagger:.1,delay:.5});
   // stat count-up
   gsap.utils.toArray('[data-count]').forEach(function(el){
     var raw=el.getAttribute('data-count'),num=parseFloat(raw)||0,suf=raw.replace(/[0-9.]/g,'');
     ScrollTrigger.create({trigger:el,start:'top 88%',once:true,onEnter:function(){
       gsap.fromTo(el,{innerText:0},{innerText:num,duration:1.4,ease:'power2.out',snap:{innerText:1},onUpdate:function(){el.innerText=Math.round(el.innerText)+suf}});
     }});
   });
 }
 // section/card reveals (one subtle pass)
 gsap.utils.toArray('.reveal:not(.hero .reveal)').forEach(function(el){
   ScrollTrigger.create({trigger:el,start:'top 90%',once:true,onEnter:function(){gsap.to(el,{opacity:1,y:0,duration:.7,ease:'power3.out'})}});
 });
 gsap.utils.toArray('.card.reveal').forEach(function(el,i){
   ScrollTrigger.create({trigger:el,start:'top 92%',once:true,onEnter:function(){gsap.to(el,{opacity:1,y:0,duration:.6,ease:'power3.out',delay:(i%2)*.08})}});
 });
 ScrollTrigger.refresh();
}
/* magnetic buttons */
function bindMag(){document.querySelectorAll('[data-mag]').forEach(function(el){
 if(el._mag)return;el._mag=1;
 el.addEventListener('mousemove',function(e){var r=el.getBoundingClientRect();gsap.to(el,{x:(e.clientX-r.left-r.width/2)*.3,y:(e.clientY-r.top-r.height/2)*.4,duration:.3});});
 el.addEventListener('mouseleave',function(){gsap.to(el,{x:0,y:0,duration:.4,ease:'elastic.out(1,.4)'});});
});}
/* 3D tilt cards + glow */
function bindTilt(){if(reduce||matchMedia('(hover:none)').matches)return;
 document.querySelectorAll('.tilt').forEach(function(el){
  if(el._tilt)return;el._tilt=1;
  el.addEventListener('mousemove',function(e){var r=el.getBoundingClientRect();var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
   el.style.transform='perspective(900px) rotateY('+((px-.5)*8)+'deg) rotateX('+((.5-py)*8)+'deg) translateY(-4px)';
   el.style.setProperty('--mx',(px*100)+'%');el.style.setProperty('--my',(py*100)+'%');});
  el.addEventListener('mouseleave',function(){el.style.transform='';});
 });
}
/* custom cursor */
(function(){if(matchMedia('(hover:none)').matches)return;
 document.body.classList.add('hascursor');
 var cur=document.querySelector('.cur'),dot=document.querySelector('.curdot');
 var x=innerWidth/2,y=innerHeight/2,cx=x,cy=y;
 addEventListener('mousemove',function(e){x=e.clientX;y=e.clientY;dot.style.transform='translate('+x+'px,'+y+'px)';
   var i=e.target.closest('a,button,.card,[data-mag],.back');cur.classList.toggle('big',!!i);});
 (function loop(){cx+=(x-cx)*.18;cy+=(y-cy)*.18;cur.style.transform='translate('+cx+'px,'+cy+'px)';requestAnimationFrame(loop);})();
})();

/* ============ Three.js node network ============ */
(function(){
 var canvas=document.getElementById('net');
 if(!window.THREE){canvas.style.display='none';return;}
 var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 var scene=new THREE.Scene();
 var cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);cam.position.z=15;
 var group=new THREE.Group();scene.add(group);
 var N=reduce?90:150, R=8, pos=[],col=[];
 var c1=new THREE.Color(0x7b61ff),c2=new THREE.Color(0x28e0cf);
 for(var i=0;i<N;i++){ // fibonacci sphere
   var yy=1-(i/(N-1))*2, r=Math.sqrt(1-yy*yy), th=i*2.399963;
   var jitter=.72+Math.random()*.28;
   var vx=Math.cos(th)*r*R*jitter, vy=yy*R*jitter, vz=Math.sin(th)*r*R*jitter;
   pos.push(vx,vy,vz);
   var c=c1.clone().lerp(c2,(yy+1)/2);col.push(c.r,c.g,c.b);
 }
 var pgeo=new THREE.BufferGeometry();
 pgeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 pgeo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 var pmat=new THREE.PointsMaterial({size:.16,vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false});
 group.add(new THREE.Points(pgeo,pmat));
 // edges between near points
 var lp=[],lc=[],D=3.4;
 for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){
   var ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2],bx=pos[b*3],by=pos[b*3+1],bz=pos[b*3+2];
   var dx=ax-bx,dy=ay-by,dz=az-bz,d=Math.sqrt(dx*dx+dy*dy+dz*dz);
   if(d<D){lp.push(ax,ay,az,bx,by,bz);
     lc.push(col[a*3],col[a*3+1],col[a*3+2],col[b*3],col[b*3+1],col[b*3+2]);}
 }
 var lgeo=new THREE.BufferGeometry();
 lgeo.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
 lgeo.setAttribute('color',new THREE.Float32BufferAttribute(lc,3));
 var lmat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false});
 group.add(new THREE.LineSegments(lgeo,lmat));
 var mx=0,my=0;
 addEventListener('mousemove',function(e){mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5);});
 function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
 addEventListener('resize',resize);resize();
 var scroll=0;addEventListener('scroll',function(){scroll=scrollY;});
 var run=true;document.addEventListener('visibilitychange',function(){run=!document.hidden;});
 var autoY=0,tmx=0,tmy=0;
 (function loop(){requestAnimationFrame(loop);if(!run)return;
   autoY+=reduce?0:.0011;                 // 은은한 자동 회전
   tmx+=(mx-tmx)*.05; tmy+=(my-tmy)*.05;  // 마우스 위치로 부드럽게 수렴
   group.rotation.y=autoY+tmx*0.9;        // 좌우 양방향 시차
   group.rotation.x=tmy*0.6;              // 상하 양방향 시차
   cam.position.z=15+scroll*.006;
   renderer.render(scene,cam);
 })();
})();

/* ============ boot ============ */
addEventListener('hashchange',function(){
 if(/^#\/p\//.test(location.hash))render();
 else if(location.hash==='#work'||location.hash==='#contact'){if(!document.getElementById('work'))render();var el=document.querySelector(location.hash);if(el)el.scrollIntoView({behavior:'smooth'});}
 else render();
});
(function(){var s;try{s=localStorage.getItem('pf-lang')}catch(e){}
 document.getElementById('yr').textContent=new Date().getFullYear();
 setLang(s||'en');})();
</script>
